{% extends "base.html" %}

{% block content %}
<h4>Loading log: {{ file }}...</h4>
<div id="container">
    <div id="log">
        <pre id="{{ file }}"></pre>
    </div>
</div>
{% endblock %}
{% block footer %}{{ super() }}{% endblock %}
{% block js %}
{{ super() }}
<script>
    // /logreader streams this log as one long-lived chunked response (it
    // sleeps and yields new lines server-side rather than ever closing), so
    // this opens a single connection and just keeps re-reading the growing
    // xhr.responseText buffer - it must NOT be re-fetched on an interval,
    // that would leak one open streaming connection per poll.
    const output = document.getElementById('{{ file }}');

    const xhr = new XMLHttpRequest();
    {% if mode == 'tail' or mode == 'full' %}
        xhr.open('GET', '/logreader?logfile={{ file }}&mode=full&json=1');
    {% else %}
        xhr.open('GET', '/logreader?logfile={{ file }}&mode={{ mode }}&json=1');
    {% endif %}
    xhr.send();

    setInterval(function() {
        output.textContent = xhr.responseText;
        {% if mode == 'tail' %}
            window.scrollTo(0, document.querySelector("#content").scrollHeight);
        {% endif %}
    }, 1000);
</script>
{% endblock %}
