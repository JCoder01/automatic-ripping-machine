{% block head %}
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="viewport" content="viewport-fit=cover, user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" crossorigin="use-credentials"/>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}"/>

    <!-- Hide page initially to prevent flash -->
    <style>
        html { visibility: hidden; }
    </style>

    <!-- dark mode script - reads the saved theme before first paint so there's no flash -->
    <script type="application/javascript">
        (function() {
            const darkPref = localStorage.getItem('darkSwitch');
            if (darkPref === 'dark') {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            }
            document.addEventListener('DOMContentLoaded', () => {
                document.documentElement.style.visibility = 'visible';
            });
        })();
    </script>

    <!-- Libraries -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/table-sort.js') }}"></script>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">

    <!-- Highlight Active Tab (sidebar or mobile drawer) -->
    <script type="application/javascript">
        function activeTab(tab) {
            document.querySelectorAll("#nav" + tab).forEach((el) => el.classList.add("active"));
        }
    </script>

    <!-- Set Page Title -->
    {% if session["arm_name"] %}
        {% if session["page_title"] %}
            <title>[{{ session["arm_name"] }}] - {{ session["page_title"] }} - ARM</title>
        {% endif %}
    {% else %}
        <title>ARM</title>
    {% endif %}

    {% block head_extra %}{% endblock %}
</head>
{% endblock %}
