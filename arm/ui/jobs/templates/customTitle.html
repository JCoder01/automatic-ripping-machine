{% extends "base.html" %}
{% block title %}Customize Title{% endblock %}

{% block nav %}{{ super() }}{% endblock %}

{% block content %}
	<div class="row text-center justify-content-center">
		<div class="col">
			<p>This is intended for DVDs or for TV Series that have more than one disk</p>
		</div>
	</div>
<div class="container justify-content-center">
    <div class="row justify-content-center" style="flex-wrap: nowrap">
        <div class="col-lg-7">
		<form action="" method="get" novalidate>
			<div class="input-group mb-3 flex-nowrap">
				<span class="input-group-text" id="searchtitle">Title</span>
				<input type="text" class="form-control{{ ' is-invalid' if 'title' in form.errors }}" aria-label="searchtitle" name="title" placeholder="title..." value="{{job.title if job.title != '' else '' }}" aria-describedby="searchtitle">
			    <div class="invalid-tooltip">
					Title can't be blank
				</div>
			</div>
			<div class="input-group mb-3 flex-nowrap">
				<span class="input-group-text" id="basic-addon1">Year</span>
				<input type="text" class="form-control{{ ' is-invalid' if 'year' in form.errors }}" name="year" aria-label="year" value="{{ job.year if job.year != '' else '' }}" aria-describedby="basic-addon1">
			</div>
			<input class="form-control" name="job_id" value="{{ job.job_id }}" hidden>
			<button class="btn btn-info btn-lg w-100" type="submit">Set Custom Title</button>
		</form>
		</div>
	</div>
</div>
{% endblock %}
