{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12 rounded text-center">
        <img src="/static/img/arm80.png" alt="Automatic Ripping Machine">
        <p><strong>Welcome to your Automatic Ripping Machine</strong></p>
    </div>
</div>

<div class="p-4 p-md-5 bg-body-tertiary rounded-3 mb-4">
    <h5 class="text-center"><strong>These are the movies we tried to send to the ARM API</strong></h5>
    <div id="loadingSpinner">
        <div class="d-flex justify-content-center align-items-center gap-2">
            <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
            <div id="currentTotal"></div>
        </div>
    </div>
    <div class="row row-cols-1 row-cols-md-3 g-3 mt-2" id="sendResults"></div>
</div>
{% endblock %}
{% block footer %}{{ super() }}{% endblock %}
{% block js %}
{{ super() }}
<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", async function () {
        activeTab("sendmovies");

        const jobItems = {{ job_list }};
        const totalEl = document.getElementById("currentTotal");
        const resultsEl = document.getElementById("sendResults");
        totalEl.innerHTML = `<h3>Sending Job Progress: 0/${jobItems.length}</h3>`;

        for (let i = 0; i < jobItems.length; i++) {
            try {
                const response = await fetch(`/json?mode=send_item&job=${jobItems[i]}`, {
                    headers: {"HX-Request": "true"}
                });
                const html = await response.text();
                resultsEl.insertAdjacentHTML("afterbegin", html);
            } catch (error) {
                console.error("Error sending job", jobItems[i], error);
            }
            totalEl.innerHTML = `<h3>Sending Job Progress: ${i + 1}/${jobItems.length}</h3>`;
        }

        document.getElementById("loadingSpinner").outerHTML =
            '<h2 class="text-center alert alert-info">Finished sending to API! Please check results below.</h2>';
    });
</script>
{% endblock %}
